name: Tests

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: ruff check oswright tests

  test-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # On Windows the default install is light: OCR comes from the built-in
      # Windows engine, so torch is never pulled in.
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: python -m pytest tests/ -v

  test-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # Deliberately installed without dependency resolution: on Linux the
      # declared OCR backend is EasyOCR, which drags in ~2.5 GB of torch. The
      # tests that need OCR or a display skip themselves, so CI installs only
      # the light runtime deps.
      - name: Install
        run: |
          pip install -e . --no-deps
          pip install mss Pillow opencv-python-headless numpy "mcp[cli]" pynput pytest
      - name: Test
        run: python -m pytest tests/ -v

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and check the distribution
        run: |
          pip install build twine
          python -m build
          python -m twine check dist/*
