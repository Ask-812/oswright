name: Release

# Publishing is driven by tags, and the token that used to be needed for it no
# longer exists. PyPI trusts this workflow directly through OIDC, so there is no
# long-lived secret to leak, rotate or accidentally commit.
#
# One-time setup on PyPI (Manage project -> Publishing -> Add a new publisher):
#
#     Owner:            Ask-812
#     Repository:       oswright
#     Workflow name:    release.yml
#     Environment:      pypi
#
# After that, `git tag vX.Y.Z && git push origin vX.Y.Z` publishes.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A release that cannot pass its own tests is not a release. This repeats the
  # checks from test.yml deliberately: a tag can be pushed to a commit that CI
  # never ran, and publishing is the one action that cannot be undone.
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check oswright tests benchmarks
      - name: Test
        run: python -m pytest tests/ -v

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          pip install build twine
          python -m build
          python -m twine check dist/*

      # The version in the tag and the version in the package have to agree.
      # Publishing 0.7.1 under a v0.8.0 tag would be unfixable: PyPI never lets
      # a version be re-uploaded.
      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python -c "import re,pathlib; print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', pathlib.Path('oswright/__init__.py').read_text()).group(1))")
          echo "tag=$TAG package=$PKG"
          test "$TAG" = "$PKG" || { echo "::error::tag $TAG does not match package version $PKG"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Required for trusted publishing. This is what replaces the API token.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
