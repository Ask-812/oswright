name: Publish to PyPI

# Publishing happens when a GitHub Release is published, through PyPI trusted
# publishing -- there is no API token to leak, rotate, or accidentally commit.
#
# Two guards exist because this is the one action that cannot be undone: PyPI
# never allows a version to be re-uploaded, so a bad release can only be
# yanked, never replaced.
#
# They are not hypothetical. 0.3.1 sat on PyPI for months in a state where
# `pip install oswright` produced a server that could not start: it pinned
# `mcp[cli]>=1.0`, and mcp 2.x removed `mcp.server.fastmcp`. Nothing in the
# release path had ever tried to import the thing it was shipping.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A release that cannot pass its own tests is not a release. This repeats
  # test.yml deliberately: a release can be cut from a commit CI never ran.
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check oswright tests benchmarks
      - name: Test
        run: python -m pytest tests/ -v

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and check the distribution
        run: |
          pip install build twine
          python -m build
          python -m twine check dist/*

      # The tag being released and the version inside the package have to
      # agree. Publishing 0.7.1 under a v0.8.0 tag is unfixable after the fact.
      - name: Check the release tag matches the package version
        if: github.event_name == 'release'
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          TAG="${TAG_NAME#v}"
          PKG=$(python -c "import re,pathlib; print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', pathlib.Path('oswright/__init__.py').read_text()).group(1))")
          echo "tag=$TAG package=$PKG"
          test "$TAG" = "$PKG" || { echo "::error::release tag $TAG does not match package version $PKG"; exit 1; }

      # Install the built wheel somewhere clean and import what is about to be
      # shipped. A package that builds is not the same as a package that runs,
      # and that difference is exactly what shipped in 0.3.1.
      - name: Install the wheel and import the server
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/python -m pip install --quiet dist/*.whl
          /tmp/smoke/bin/python - <<'PY'
          import oswright
          from mcp.server.fastmcp import FastMCP
          from oswright.mcp_server import mcp
          from oswright.cascade import resolve
          print("smoke test ok:", oswright.__version__)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Required for trusted publishing. This is what replaces the API token.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
